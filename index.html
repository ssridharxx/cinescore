<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScore - Movie Reviews & Ratings</title>
    <style>
        :root {
            --md-sys-color-primary: #d0bcff;
            --md-sys-color-on-primary: #381e72;
            --md-sys-color-surface: #141218;
            --md-sys-color-on-surface: #e6e1e5;
            --md-sys-color-surface-container: #211f26;
            --md-sys-color-surface-container-high: #2b2930;
            --md-sys-color-outline: #938f99;
            --md-sys-color-error: #f2b8b5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--md-sys-color-surface-container);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        header {
            padding: 20px;
            background: var(--md-sys-color-surface-container-high);
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-tabs {
            display: flex;
            background: var(--md-sys-color-surface-container-high);
            padding: 0 16px 12px 16px;
            gap: 8px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--md-sys-color-outline);
            border: none;
            padding: 8px;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .movie-card {
            background: var(--md-sys-color-surface-container-high);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .movie-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--md-sys-color-primary);
        }

        .movie-genre {
            font-size: 0.85rem;
            color: var(--md-sys-color-outline);
            margin-bottom: 12px;
        }

        .score-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(208, 188, 255, 0.1);
            color: var(--md-sys-color-primary);
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .review-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: var(--md-sys-color-on-surface);
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button.action-btn {
            flex: 1;
            background: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            border: none;
            padding: 10px;
            border-radius: 100px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        button.secondary {
            background: transparent;
            color: var(--md-sys-color-primary);
            border: 1px solid var(--md-sys-color-outline);
        }

        .add-section {
            padding: 16px;
            background: var(--md-sys-color-surface-container-high);
            border-top: 1px solid var(--md-sys-color-outline);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input, textarea {
            width: 100%;
            background: var(--md-sys-color-surface);
            border: 1px solid var(--md-sys-color-outline);
            border-radius: 12px;
            padding: 10px;
            color: var(--md-sys-color-on-surface);
            font-size: 0.9rem;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--md-sys-color-primary);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <span>🎬 CineScore</span>
            <span style="font-size: 0.8rem; color: var(--md-sys-color-outline);">Material You</span>
        </header>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('home', this)">Feed</button>
            <button class="tab-btn" onclick="switchTab('search', this)">Search</button>
            <button class="tab-btn" onclick="switchTab('add', this)">+ Review</button>
        </div>

        <div class="content">
            <!-- Home Feed View -->
            <div id="home-view" class="view-section active">
                <div id="movieList">
                    <div class="movie-card">
                        <div class="movie-title">Dune: Part Two</div>
                        <div class="movie-genre">Sci-Fi • Adventure</div>
                        <div class="score-badge">⭐ 9.2 / 10 Score</div>
                        <div class="review-text">An absolute cinematic masterpiece with breathtaking visuals and immersive sound design.</div>
                        <div class="actions">
                            <button class="action-btn" onclick="shareScore('Dune: Part Two', '9.2/10')">Share Score</button>
                            <button class="action-btn secondary" onclick="alert('Added to favorites!')">Favorite</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search View -->
            <div id="search-view" class="view-section">
                <input type="text" id="searchInput" placeholder="Search movies or reviews..." oninput="searchMovies()" style="margin-bottom: 16px;">
                <div id="searchResults" style="font-size: 0.9rem; color: var(--md-sys-color-outline);">
                    Type a title above to filter reviews...
                </div>
            </div>

            <!-- Add Review View -->
            <div id="add-view" class="view-section">
                <div class="add-section" style="border: none; background: transparent; padding: 0;">
                    <div style="font-weight: 600; margin-bottom: 8px; color: var(--md-sys-color-primary);">Publish New Movie Score</div>
                    <input type="text" id="movieTitle" placeholder="Movie Title">
                    <input type="text" id="movieGenre" placeholder="Genre (e.g. Action, Drama)">
                    <input type="text" id="movieScore" placeholder="Score (e.g. 8.5/10)">
                    <textarea id="movieReview" placeholder="Write your review..." rows="3"></textarea>
                    <button class="action-btn" onclick="addReview()">Post Review</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName, element) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName + '-view').classList.add('active');
            element.classList.add('active');
        }

        function addReview() {
            const title = document.getElementById('movieTitle').value;
            const genre = document.getElementById('movieGenre').value || 'General';
            const score = document.getElementById('movieScore').value;
            const review = document.getElementById('movieReview').value;

            if(!title || !score) {
                alert('Please enter a movie title and score.');
                return;
            }

            const list = document.getElementById('movieList');
            const card = document.createElement('div');
            card.className = 'movie-card';
            card.innerHTML = `
                <div class="movie-title">${title}</div>
                <div class="movie-genre">${genre}</div>
                <div class="score-badge">⭐ ${score} Score</div>
                <div class="review-text">${review || 'No detailed review provided.'}</div>
                <div class="actions">
                    <button class="action-btn" onclick="shareScore('${title}', '${score}')">Share Score</button>
                    <button class="action-btn secondary" onclick="alert('Added to favorites!')">Favorite</button>
                </div>
            `;
            list.prepend(card);

            document.getElementById('movieTitle').value = '';
            document.getElementById('movieGenre').value = '';
            document.getElementById('movieScore').value = '';
            document.getElementById('movieReview').value = '';

            // Switch back to home view to see the review
            switchTab('home', document.querySelectorAll('.tab-btn')[0]);
        }

        function shareScore(title, score) {
            const text = `Check out this movie score! ${title} rated ${score} on CineScore.`;
            if (navigator.share) {
                navigator.share({ title: 'Movie Score', text: text }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text);
                alert('Score card copied to clipboard!');
            }
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('#movieList .movie-card');
            let foundCount = 0;
            
            cards.forEach(card => {
                const title = card.querySelector('.movie-title').innerText.toLowerCase();
                if(title.includes(query)) {
                    card.style.display = 'block';
                    foundCount++;
                } else {
                    card.style.display = 'none';
                }
            });

            document.getElementById('searchResults').innerText = foundCount === 0 ? 'No matching movies found.' : `Found ${foundCount} review(s).`;
        }
    </script>
</body>
</html>
